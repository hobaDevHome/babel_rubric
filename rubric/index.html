:root{--bg:#f6f5f1;--sf:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#0f766e;--ac2:#d1fae5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151816;--sf:#1e2321;--tx:#ecebe6;--mu:#9c9b94;--bd:#2f3633;--ac:#5eead4;--ac2:#134e4a}}
:root[data-theme=dark]{--bg:#151816;--sf:#1e2321;--tx:#ecebe6;--mu:#9c9b94;--bd:#2f3633;--ac:#5eead4;--ac2:#134e4a}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.8 Cairo,Tahoma,sans-serif}
main{max-width:1000px;margin:auto;padding:0 16px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 10px;z-index:5;border-bottom:1px solid var(--bd)}
h1{font-size:20px;margin:0 0 8px;line-height:1.7}
.bar{display:flex;gap:8px}
button{font:inherit;cursor:pointer}
input[type=search]{flex:1;min-width:0;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit;unicode-bidi:plaintext}
.rs{border:1px solid var(--bd);background:var(--sf);color:var(--mu);border-radius:8px;padding:6px 12px;white-space:nowrap}
.pg{height:6px;background:var(--bd);border-radius:4px;margin-top:10px;overflow:hidden}.pg i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.sec{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-top:10px}
.sec.done{border-color:var(--ac)}
.hd{display:flex;align-items:center;gap:10px;padding:8px 14px}
.hd input{width:20px;height:20px;accent-color:var(--ac);flex:none}
.hd label,.hd b{flex:1;font-weight:700;cursor:pointer}
.sec.done .hd label{text-decoration:line-through;color:var(--mu)}
.ar{background:none;border:0;color:var(--mu);padding:2px 10px;font-size:20px;transition:transform .2s}
.sec.open .ar{transform:rotate(180deg)}
.bd{display:none;padding:2px 18px 14px;border-top:1px solid var(--bd)}
.sec.open .bd{display:block}
h3{font-size:15px;margin:12px 0 0;color:var(--ac)}
ul{margin:4px 0 0;padding-inline-start:20px}li{margin:3px 0}
code{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:0 5px;unicode-bidi:isolate;font-size:.92em}
.tb{display:grid;grid-template-columns:1fr auto 1fr auto;margin-top:8px}
.tb.f{grid-template-columns:repeat(4,1fr)}
.r{display:contents}.r[hidden]{display:none}
.tb>*,.r>*{padding:4px 10px;border-bottom:1px solid var(--bd);unicode-bidi:isolate}
.th{font-weight:700;color:var(--mu);font-size:14px}
.y,.n{font-size:13px;white-space:nowrap;align-self:center;justify-self:start;border-radius:99px;padding:0 10px!important;border:0!important}
.y{background:var(--ac2);color:var(--ac)}.n{color:var(--mu);background:var(--bg)}
#no{display:none;text-align:center;color:var(--mu);margin-top:24px}
@media(max-width:560px){.tb,.tb.f{grid-template-columns:1fr auto}.tb.f{grid-template-columns:1fr 1fr}.th:nth-child(n+3){display:none}}

["تدقيق لغوي",["#كلمات","صحّحي أي كلمة لا تطابق المنطوق: مفقودة، زائدة، أو خاطئة (متشابهة النطق). لو الارتجال مش واضح: افترضي إن الممثل أدّى النص.","`هما` للمثنى (غالبًا مش بنستخدمها)، و`هم` للجمع حتى لو اتنطقت «هما».","أي حاجة شبه «بالظبط» بالضاد: `بالضبط`، مضبوط، ضابط، اضبط.","`دوّة` ✅ `دوت` ❌ (راجعي جدول الحشو).","أي غلط في النطق: اعملي له `admin-rate`.","#الإملاء","الهمزات (أ، إ، آ، ا): أكتر غلطة بتتكرر. `اكتب` أمر، `أكتب` مضارع، والموقع مش هيلقطها فلازم السياق. الألف الأصلية: `هاجيب` / `مش هجيب`.","الياء والألف اللينة: `في` بنقطتين، `إلى` بدون نقط.","التاء والهاء المربوطة: المؤنث بتاء (`شجرة` ✅ `شجره` ❌)، والضمير بهاء (`هذه` ✅ `هذة` ❌، `يأكله` ✅ `يأكلة` ❌). `بكره` بالهاء المربوطة.","الواو متصلة بما بعدها: `اقرأ واكتب` ✅ `اقرأ و اكتب` ❌.","أداة النفي `ما` مفصولة: `ما تزعلش`، `ما حدش`.","حرف الجر مفصول: `في الشارع`.","`لك` مفصولة: `قلت لك`، `قالت لي`.","`في` = يوجد. `فيه`: الهاء لازم تعود على حاجة قبلها والسياق قابل للتأنيث.","مد آخر الحرف مش بيتكتب، لكن حشو `آآ` بيتكتب: `بس آآ`.","مسافة زيادة أو كلام ملزوق ❌: `قام   أحمد` ← `قام أحمد`."]],

["الترقيم",["اتبعي التعليمات في الجايد. كل سطر ينتهي بنقطة أو علامة استفهام.","#الفاصلة ( ، )","بدون مسافة قبلها، ومسافة بعدها، والواو بعدها متصلة: `اقرأ، واكتب الدرس.` ✅ `اقرأ ، واكتب` ❌ `اقرأ،واكتب` ❌ `اقرأ، و اكتب` ❌.","بين الجمل القصيرة المترابطة.","نفس الروتين/الترتيب/المجموعة مع حرف عطف: العطف يكفي: `أنا باصحى أصلي واعمل القهوة والفطار.`","مفيش حرف عطف: فاصلة: `الشهور الحُرم هي: رجب، ذو القعدة، ذو الحجة، محرّم.`","أفعال مالهاش علاقة ببعض: فاصلة: `...والفطار، وبعدين بانزل الشغل.`","#الفاصلة المنقوطة ( ؛ )","(1) بين جملتين إحداهما سبب أو نتيجة للأخرى. (2) بين الأقسام والتصنيفات المركبة. (3) بين الجمل الطويلة لمعادلة المعنى. اتأكدي 100% قبل وضعها أو إزالتها.","#النقطة والاستفهام والتعجب","`.` نهاية الجملة التامة أو الفقرة. `؟` الجملة الاستفهامية (غالبًا واضح من السياق).","`!` مشاعر قوية (تعجب، حزن، فرح، دعاء، تحذير): `ما شاء الله!` `واو!`","`؟!` سؤال في الظاهر وتعجب/استنكار في الباطن: `أنت بتقول لي أنا كده؟!`","#التنصيص والاعتراض","`\" \"` للمقتبس حرفيًا: `قال النبي: \"إنما الأعمال بالنيات\"`. النقل غير المباشر بدون تنصيص: ماما قال لي إني لازم أذاكر.","`- -` للجملة الاعتراضية (دعاء/توضيح): `كان عمر - رضي الله عنه - عادلًا.`","#علامة الحذف ( ... )","موجودة في الاسكريبت الأصلي للتوقف. الممثل وقف عندها: اتركيها. ما وقفش: احذفيها. ممنوع تضيفيها. لو سكت مكانها: سيبيها زي ما هي، ما تستبدليهاش بتاج وقفة.","#الشرطة (-)","متصلة بالكلمة السابقة، يليها مسافة. للتلعثم (تكرار سريع غير مقصود لكلمة أو جزء منها): `<متلعثم> أنا م- أنا مش </متلعثم> عارفة.` / `<stammer> Hur- hurry, </stammer> get out of here!`","#الشرطتان (--)","متصلتان بالكلمة السابقة، يليهما مسافة. المتحدث يقطع كلامه أو يغيّر مساره (حتى لو صحّح نفسه فورًا): `أنا عايزة شا-- قهوة.` / `أنا عايزة شا-- خلاص هامشي.` / `إحنا روحنا لل-- إحنا هنروح المحل.`","#مع التاج","الفاصلة داخل تاج الستايل. الترقيم عمومًا مع التاج. «ال» التعريف وحروف العطف والجر متصلة."]],
["أصوات",["الأصوات غير المكتوبة (ضحك، نحنحة، عطس): تُترجم بدقة. `Ctrl+Shift` بيفتح الليستة.","التنهد معاه صوت. غير كده هو نفس.","#الضحك","1) `[ضحكة]` مرة واحدة قبل أول كلمة بتتنطق أثناء الضحك. 2) الضحك وقف والكلام استمر: بدون وسم. 3) رجع يضحك أثناء الكلام: `[ضحكة]` جديد قبل أول كلمة في المقطع. 4) ما نكررش الوسم طول الضحك المستمر.","#الحشو","ما نطيلش الحشو بحرف زيادة: `همم` مش `همممم`. الصيغة من جدول الحشو. حشو مش في القائمة: فرّغيه صوتيًا وأضيفيه كاقتراح."]],

d.dataset.t=norm(title+' '+(i<0?'':body.replace(/<[^>]+>/g,' ')));
const head=i<0?'<b>'+title+'</b>':`<input type="checkbox" id="c${i}"><label for="c${i}">${title}</label>`;
d.innerHTML=`<div class="hd">${head}<button class="ar" aria-label="فتح أو قفل">▾</button></div><div class="bd">${body}</div>`;
d.querySelector('.ar').onclick=()=>{d.classList.toggle('open');delete d.dataset.a};
if(i>=0){const c=d.querySelector('input');c.checked=!!st[i];d.classList.toggle('done',c.checked);
c.onchange=()=>{st[i]=c.checked;d.classList.toggle('done',c.checked);save();prog()}}
M.appendChild(d);return d};
S.forEach((s,i)=>mk(s[0],L(s[1]),i));
T.forEach(t=>{const f=t[1]=='f';let h='<div class="tb'+(f?' f':'')+'"><div class="th">'+(f?'يتسمع':'كلمة')+'</div><div class="th">'+(f?'يتكتب':'تاج؟')+'</div><div class="th">'+(f?'يتسمع':'كلمة')+'</div><div class="th">'+(f?'يتكتب':'تاج؟')+'</div>';
t[2].split('\n').forEach(l=>{const[a,b]=l.split('|');const v=f?'<div>'+E(b)+'</div>':(b=='1'?'<div class="y">يأخذ تاج</div>':'<div class="n">بدون</div>');
h+='<div class="r" data-t="'+norm(a+' '+(f?b:b=='1'?'تاج':'بدون'))+'"><div>'+E(a)+'</div>'+v+'</div>'});
mk(t[0],h+'</div>',-1)});
const prog=()=>{const n=S.filter((_,i)=>st[i]).length;document.getElementById('pg').style.width=n/S.length*100+'%'};prog();
document.getElementById('rs').onclick=()=>{st={};save();document.querySelectorAll('.hd input').forEach(c=>{c.checked=false;c.closest('.sec').classList.remove('done')});prog()};
document.getElementById('q').oninput=e=>{const v=norm(e.target.value.trim());let any=0;
document.querySelectorAll('.sec').forEach(s=>{let hit,rows=s.querySelectorAll('.r');
if(rows.length){let n=0;rows.forEach(r=>{const m=!v||r.dataset.t.includes(v);r.hidden=!m;if(m)n++});hit=!v||n>0||s.dataset.t.includes(v);if(v&&!n&&hit)rows.forEach(r=>r.hidden=false)}
else hit=!v||s.dataset.t.includes(v);
s.style.display=hit?'':'none';if(hit)any=1;
if(v&&hit&&!s.classList.contains('open')){s.classList.add('open');s.dataset.a=1}
if(!v&&s.dataset.a){s.classList.remove('open');delete s.dataset.a}});
document.getElementById('no').style.display=any?'none':'block'};
</script></main></body></html>
